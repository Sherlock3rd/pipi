<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>陈皮 · 角色标准与30帧验收</title>
<style>body{margin:0;background:#efede7;color:#35413b;font:14px/1.7 'Microsoft YaHei UI',sans-serif}main{max-width:1100px;margin:auto;padding:28px}h1{font-size:25px}h2{font-size:18px}.card{padding:20px;background:#fcfaf5;border-radius:18px;margin:16px 0}.standard{width:100%;max-height:680px;object-fit:contain}.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}button,select{padding:8px 12px;border-radius:8px;border:1px solid #c4c9bf;background:#fff;font:inherit}input{flex:1}a{color:#507351}.stage{height:320px;position:relative;display:flex;align-items:center;justify-content:center;background:#e9e5db;border-radius:12px}.dark{background:#252c35}.stage img{width:256px;height:256px;object-fit:contain}.small img{width:180px;height:180px}.muted{color:#7a7e73}.status{background:#f6e4ca;padding:10px 16px;border-radius:10px}.reference{display:grid;grid-template-columns:2fr 1fr;gap:12px}.reference img{width:100%;object-fit:contain}output{min-width:75px}.hidden{display:none}</style>
<main><h1>陈皮 · 角色标准与 30 帧验收</h1><p class="status" id="status">重制进行中。候选图不等于验收通过，未通过的动画不会替换到桌宠。</p>
<section class="card"><h2>照片身份 × B 绘本厚涂</h2><img class="standard" src="references/canonical-sheet.png" alt="统一角色标准图候选" onerror="this.hidden=true"><p class="muted">照片约束脸、体型和自然姿态，B 原画约束笔触与画法。所有动作必须回查这一标准。</p><div id="identityNote"></div></section>
<section class="card"><h2>动作逐帧检查</h2><div class="stage" id="stage"><img id="cat" alt="当前动作候选" hidden></div><p id="motionNote">完整片段尚未生成。先验收步态和蜷睡关键姿。</p><div class="row"><select id="clips" aria-label="选择动作"></select><button id="play">播放</button><button id="prev">上一帧</button><button id="next">下一帧</button><button id="bg">深浅背景</button><button id="size">实际尺寸</button><button id="mirror">镜像</button><select id="speed" aria-label="速度"><option value=".25">1/4速度</option><option value=".5">半速</option><option value="1" selected>原速</option></select></div><div class="row"><input id="scrub" type="range" min="0" max="29" value="0" aria-label="逐帧"><output id="counter">0 / 30</output></div></section>
<p><a href="qa/rejected-24-audit.md">旧版否决原因</a> · <a href="acceptance.md">本轮硬性验收标准</a> · <a href="progress.md">制作进度</a></p></main>
<script>
const $=s=>document.querySelector(s),labels={'idle':'发呆眨眼','walk':'移动','move-to-sit':'移动到坐下','sit-to-idle':'坐下到发呆','sit-to-sleep':'坐下到睡觉','sleep':'蜷睡'};
let definitions={},selected='',frame=0,elapsed=0,last=performance.now(),playing=false,flipped=false;
function show(i){if(!selected)return;frame=i;const def=definitions[selected];$('#cat').src=`${def.folder||'frames/'+selected}/${String(i).padStart(2,'0')}.png`;$('#cat').hidden=false;$('#counter').value=`${i+1} / ${def.count||30}`;$('#scrub').max=(def.count||30)-1;$('#scrub').value=i;document.body.dataset.frame=i;document.body.dataset.clip=selected;}
function pause(){playing=false;$('#play').textContent='播放';}
function select(){pause();selected=$('#clips').value;elapsed=0;show(0);$('#motionNote').textContent=definitions[selected].note||'未完成严格验收';}
$('#clips').onchange=select;$('#play').onclick=()=>{if(!selected)return;if(!playing&&!definitions[selected].loop&&frame===(definitions[selected].count||30)-1){elapsed=0;show(0);}playing=!playing;$('#play').textContent=playing?'暂停':'播放';};
$('#scrub').oninput=()=>{pause();show(Number($('#scrub').value));elapsed=frame/definitions[selected].fps;};
for(const [id,delta] of [['#prev',-1],['#next',1]])$(id).onclick=()=>{if(!selected)return;pause();const count=definitions[selected].count||30;show((frame+delta+count)%count);elapsed=frame/definitions[selected].fps;};
$('#bg').onclick=()=>$('#stage').classList.toggle('dark');$('#size').onclick=()=>$('#stage').classList.toggle('small');$('#mirror').onclick=()=>{flipped=!flipped;$('#cat').style.transform=flipped?'scaleX(-1)':'';};
function tick(now){if(playing&&selected){const def=definitions[selected],count=def.count||30;elapsed+=Math.min(.15,(now-last)/1000)*Number($('#speed').value);if(elapsed>=count/def.fps){if(def.loop)elapsed%=count/def.fps;else{elapsed=(count-1)/def.fps;pause();}}const next=Math.min(count-1,Math.floor(elapsed*def.fps));if(next!==frame)show(next);}last=now;requestAnimationFrame(tick);}requestAnimationFrame(tick);
fetch('review-status.json').then(r=>r.json()).then(async data=>{$('#status').textContent=data.status;$('#identityNote').textContent=data.identityNote;definitions=data.clips||{};$('#play').disabled=true;const loads=[];for(const [name,def]of Object.entries(definitions)){$('#clips').add(new Option(labels[name],name));for(let i=0;i<(def.count||30);i++)loads.push(new Promise((resolve,reject)=>{const img=new Image;img.onload=resolve;img.onerror=reject;img.src=`${def.folder||'frames/'+name}/${String(i).padStart(2,'0')}.png`;}));}await Promise.all(loads);$('#play').disabled=false;if(Object.keys(definitions).length)select();}).catch(()=>{$('#motionNote').textContent='候选帧载入不完整，已停止播放。';pause();});
</script></html>
