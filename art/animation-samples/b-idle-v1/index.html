<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>陈皮 · B 风格动画小样</title>
<style>
:root {font-family:"Microsoft YaHei UI",sans-serif;color:#393f3b;background:#eeeee7;font-synthesis:none}
* {box-sizing:border-box} body {margin:0;padding:32px} main {max-width:960px;margin:auto}
header {display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}
h1 {font-size:25px;font-weight:600;letter-spacing:.02em;margin:8px 0} p {line-height:1.8;margin:8px 0;color:#747970;font-size:14px}
.eyebrow {font-size:11px;letter-spacing:.18em;color:#8b9382}.badge {border:1px solid #cbd2c0;border-radius:30px;padding:8px 14px;font-size:12px;white-space:nowrap}
.stages {display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}.card {background:#fbfaf5;border-radius:22px;overflow:hidden}
.reference {aspect-ratio:1;background:#f8f5ed url('references/style-exploration-v1.png') center top / 300% 200% no-repeat}
.stage {height:330px;display:flex;justify-content:center;align-items:center;background:#f8f5ed;transition:background .15s}
.stage.dark {background:#252c35}.stage img {display:block;width:192px;height:208px;object-fit:contain}.stage.large img {width:288px;height:312px}
.caption {padding:14px 20px;border-top:1px solid #e9e9e0;font-size:12px;display:flex;justify-content:space-between;color:#7c8376}
.controls {margin-top:20px;padding:20px;background:#fbfaf5;border-radius:18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
button,select {font:inherit;font-size:13px;border:1px solid #d5dacd;border-radius:10px;background:#f3f4eb;color:#3b4839;padding:9px 14px;cursor:pointer} button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #52705a;outline-offset:3px}
input[type=range]{accent-color:#5f7761;flex:1;min-width:110px} label,output{font-size:12px;color:#727d6d}
.contact {width:100%;margin-top:20px;border-radius:12px}.links {display:flex;gap:20px;margin-top:16px;font-size:12px} a{color:#52705a}
@media(max-width:850px){body{padding:18px}.stages{grid-template-columns:repeat(2,minmax(0,1fr))}.card:last-child{grid-column:1/-1}.stage{height:300px}header{align-items:start}.badge{display:none}}
@media(max-width:430px){.stages{grid-template-columns:1fr}}
</style>
<main>
<header><div><div class="eyebrow">CHENPI / MOTION STUDY 01</div><h1>B 风格 · 安静地陪着你</h1><p>坐着呼吸、轻轻眨眼。先看看笔触和动作在小尺寸下的感觉。</p></div><div class="badge">2D 绘本厚涂 · 动画试样</div></header>
<section class="stages">
<div class="card"><div class="reference" role="img" aria-label="原画 B，直接显示原图上方中间区域"></div><div class="caption"><span>原画 B · 造型依据</span><a href="references/style-exploration-v1.png">完整原图</a></div></div>
<div class="card"><div class="stage" id="light"><img id="normal" alt="B 风格小猫循环动画"></div><div class="caption"><span>浅色桌面</span><span>192 × 208</span></div></div>
<div class="card"><div class="stage dark large" id="dark"><img id="large" alt="深色背景放大动画"></div><div class="caption"><span>深色桌面</span><span>1.5 倍检查</span></div></div>
</section>
<div class="controls">
<button id="play" type="button">暂停</button><button id="step" type="button">下一帧</button>
<label for="speed">播放速度</label><select id="speed"><option value="0.5">0.5 倍</option><option value="1" selected>正常</option><option value="1.5">1.5 倍</option></select>
<input type="range" min="0" max="5" value="0" step="1" id="scrub" aria-label="逐帧查看"><output id="frame">加载中…</output>
</div>
<p id="note">鼻口修订版 · 六帧，约 2.7 秒循环。嘴线与嘴垫已柔化，请对照左侧原画评审；仍为试样，未定稿或替换正式桌宠。</p>
<img class="contact" src="qa/contact-sheet.png?v=muzzle-v3" alt="六帧动作检查图">
<nav class="links"><a href="final/idle.gif">GIF 预览</a><a href="final/idle.webp">透明 WebP</a><a href="final/spritesheet.png">PNG 序列帧图集</a></nav>
</main>
<script>
const durations=[1300,180,100,120,150,850],total=durations.reduce((a,b)=>a+b,0);
let elapsed=0,previous=performance.now(),playing=true,current=-1;
const normal=document.querySelector('#normal'),large=document.querySelector('#large'),scrub=document.querySelector('#scrub'),label=document.querySelector('#frame'),play=document.querySelector('#play'),speed=document.querySelector('#speed');
const paths=durations.map((_,i)=>`frames/idle/${String(i).padStart(2,'0')}.png?v=muzzle-v3`);
function show(index){if(index===current)return;current=index;normal.src=large.src=paths[index];scrub.value=index;label.value=`${index+1} / 6`;document.body.dataset.frame=index;}
function pause(){playing=false;play.textContent='播放';}
play.onclick=()=>{playing=!playing;play.textContent=playing?'暂停':'播放';previous=performance.now();};
scrub.oninput=()=>{pause();elapsed=durations.slice(0,+scrub.value).reduce((a,b)=>a+b,0);show(+scrub.value);};
document.querySelector('#step').onclick=()=>{pause();const index=(current+1)%6;elapsed=durations.slice(0,index).reduce((a,b)=>a+b,0);show(index);};
function tick(now){if(playing){elapsed=(elapsed+Math.min(now-previous,200)*Number(speed.value))%total;let t=0;for(let i=0;i<6;i++){t+=durations[i];if(elapsed<t){show(i);break;}}}previous=now;requestAnimationFrame(tick);}
Promise.all(paths.map(src=>new Promise((resolve,reject)=>{const img=new Image();img.onload=resolve;img.onerror=reject;img.src=src;}))).then(()=>{show(0);previous=performance.now();requestAnimationFrame(tick);}).catch(()=>{pause();label.value='加载失败';document.querySelector('#note').textContent='帧文件加载失败，请从保留完整文件夹的预览地址打开。';});
</script>
</html>
