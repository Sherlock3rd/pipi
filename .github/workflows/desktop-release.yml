name: Desktop release and native macOS checks
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/*release*'
      - 'tools/package_runtime.py'
      - 'tools/test_macos_native.py'
      - 'tools/test_macos_desktop.py'
      - 'tools/check_macos_performance.py'
      - 'tools/macos_window_fixture.swift'
      - 'tools/macos_input_fixture.swift'
      - 'tools/test_macos_input.py'
      - 'packaging/**'
      - '.github/workflows/desktop-release.yml'
permissions:
  contents: read
jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            rid: osx-arm64
          - runner: macos-15-intel
            rid: osx-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
            tests
            assets
            tools
            packaging
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r tools/requirements-release.txt
      - name: Shared behavior regression
        run: dotnet run --project tests/Chenpi.Tests/Chenpi.Tests.csproj -c Release
      - name: Early native host check against source assets
        run: |
          dotnet publish src/Chenpi.Mac/Chenpi.Mac.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:SkipAssetCopy=true -p:PublishSingleFile=true -p:DebugType=None -o artifacts/native-probe
          ln -s "$PWD/assets" artifacts/native-probe/assets
          codesign --force --sign - --entitlements packaging/macos/entitlements.plist artifacts/native-probe/Chenpi.Mac
          python tools/test_macos_native.py artifacts/native-probe/Chenpi.Mac
          mkdir -p artifacts/early-native-qa
          artifacts/native-probe/Chenpi.Mac --preview --native-audit --editor-audit "$PWD/artifacts/early-native-qa/editor" --data-dir "$PWD/artifacts/early-native-qa/save" --snapshot "$PWD/artifacts/early-native-qa/scene.png" --exit-after 20
          test -f artifacts/early-native-qa/save/native-audit.txt
          test -f artifacts/early-native-qa/editor/verification.json
          test ! -f artifacts/early-native-qa/save/error.log
      - name: Real native mouse input and old-layer negative control
        run: python tools/test_macos_input.py artifacts/native-probe/Chenpi.Mac artifacts/early-native-qa/input
      - uses: actions/cache/restore@v4
        id: asset-cache
        with:
          path: artifacts/runtime-assets
          key: lossless-frames-v1-${{ hashFiles('assets/**', 'tools/package_runtime.py', 'tools/requirements-release.txt') }}
      - name: Lossless pack and pixel verification
        if: steps.asset-cache.outputs.cache-hit != 'true'
        run: python tools/package_runtime.py --output artifacts/runtime-assets --workers 3
      - uses: actions/cache/save@v4
        if: steps.asset-cache.outputs.cache-hit != 'true'
        with:
          path: artifacts/runtime-assets
          key: ${{ steps.asset-cache.outputs.cache-primary-key }}
      - name: Build and ad-hoc sign app bundle
        run: python tools/build_release.py --rid ${{ matrix.rid }} --assets artifacts/runtime-assets
      - name: Verify the extracted distributable
        run: |
          mkdir -p artifacts/unpacked
          ditto -x -k dist/releases/Chenpi-${{ matrix.rid }}.zip artifacts/unpacked
          codesign --verify --deep --strict artifacts/unpacked/Chenpi.app
      - name: Native full-screen and normal-window checks
        run: python tools/test_macos_native.py artifacts/unpacked/Chenpi.app/Contents/MacOS/Chenpi.Mac
      - name: Extracted app native click drag and settings acceptance
        run: python tools/test_macos_input.py artifacts/unpacked/Chenpi.app/Contents/MacOS/Chenpi.Mac artifacts/native-qa/input
      - name: Native decoded pixels and pooled-buffer lifetime
        run: artifacts/unpacked/Chenpi.app/Contents/MacOS/Chenpi.Mac --audit-source "$PWD/assets" --audit-output "$PWD/artifacts/native-qa/pixel-audit.json"
      - name: Native startup and frame-cache smoke test
        run: |
          mkdir -p artifacts/native-qa
          artifacts/unpacked/Chenpi.app/Contents/MacOS/Chenpi.Mac --preview --native-audit --data-dir "$PWD/artifacts/native-qa/save" --snapshot "$PWD/artifacts/native-qa/scene.png" --exit-after 85
          test -f artifacts/native-qa/save/native-audit.txt
          test -f artifacts/native-qa/scene.png.json
          test ! -f artifacts/native-qa/save/error.log
      - name: Transparent desktop host and screenshot
        run: python tools/test_macos_desktop.py artifacts/unpacked/Chenpi.app/Contents/MacOS/Chenpi.Mac artifacts/native-qa
      - name: Record native display hardware
        run: system_profiler SPDisplaysDataType > artifacts/native-qa/display-hardware.txt
      - name: Animation performance acceptance
        run: |
          python tools/check_macos_performance.py artifacts/native-qa/scene.png.json
          python tools/check_macos_performance.py artifacts/native-qa/desktop-scene.png.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Chenpi-${{ matrix.rid }}
          compression-level: 0
          path: |
            dist/releases/*.zip
            dist/releases/*.sha256
            artifacts/native-qa
            artifacts/early-native-qa
            artifacts/runtime-assets/pack-report.json
          retention-days: 14
