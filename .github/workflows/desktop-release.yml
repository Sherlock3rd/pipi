name: Desktop release and native macOS checks
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/*release*'
      - 'tools/package_runtime.py'
      - 'tools/test_macos_native.py'
      - 'tools/macos_window_fixture.swift'
      - 'packaging/**'
      - '.github/workflows/desktop-release.yml'
permissions:
  contents: read
jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            rid: osx-arm64
          - runner: macos-15-intel
            rid: osx-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
            tests
            assets
            tools
            packaging
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r tools/requirements-release.txt
      - name: Shared behavior regression
        run: dotnet run --project tests/Chenpi.Tests/Chenpi.Tests.csproj -c Release
      - name: Lossless pack and pixel verification
        run: python tools/package_runtime.py --output artifacts/runtime-assets --workers 3
      - name: Build and ad-hoc sign app bundle
        run: python tools/build_release.py --rid ${{ matrix.rid }} --assets artifacts/runtime-assets
      - name: Native full-screen and normal-window checks
        run: python tools/test_macos_native.py dist/releases/${{ matrix.rid }}/Chenpi.app/Contents/MacOS/Chenpi.Mac
      - name: Native startup and frame-cache smoke test
        run: |
          mkdir -p artifacts/native-qa
          dist/releases/${{ matrix.rid }}/Chenpi.app/Contents/MacOS/Chenpi.Mac --preview --native-audit --data-dir "$PWD/artifacts/native-qa/save" --snapshot "$PWD/artifacts/native-qa/scene.png" --exit-after 85
          test -f artifacts/native-qa/save/native-audit.txt
          test -f artifacts/native-qa/scene.png.json
          test ! -f artifacts/native-qa/save/error.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Chenpi-${{ matrix.rid }}
          compression-level: 0
          path: |
            dist/releases/*.zip
            dist/releases/*.sha256
            artifacts/native-qa
            artifacts/runtime-assets/pack-report.json
          retention-days: 14
